name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same major as the Supabase project.
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: linkables_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/linkables_test
      MIGRATION_DATABASE_URL: postgres://postgres:postgres@localhost:5432/linkables_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/linkables_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm verify

  e2e:
    runs-on: ubuntu-latest
    # A cold `playwright install --with-deps` alone has taken about 10 minutes.
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: linkables_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The suite's global setup migrates this database before the tests run.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/linkables_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # Runs even on a cache hit: the system libraries Chromium needs are not cached.
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/e2e/playwright-report/
            apps/web/e2e/test-results/
          retention-days: 7

  image:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: linkables_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f apps/api/Dockerfile -t linkables-api:ci .
      - run: deploy/smoke-test.sh linkables-api:ci
        env:
          SMOKE_DATABASE_URL: postgres://postgres:postgres@localhost:5432/linkables_smoke

  # The server pulls :main itself (deploy/README.md), so moving :main is the
  # deploy. Order: push SHA-tagged images, migrate, then move :main, so a failed
  # build never leaves the schema ahead of what can be deployed. Migrations must
  # still work with the previous image until the server's next pull (AGENTS.md).
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, e2e, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # One at a time; with the head check below, an older run can never move
    # :main back after a newer one.
    concurrency:
      group: publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Check deploy settings
        env:
          APP_ORIGIN: ${{ vars.APP_ORIGIN }}
          HAS_MIGRATION_URL: ${{ secrets.MIGRATION_DATABASE_URL != '' }}
          HAS_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL != '' }}
          HAS_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY != '' }}
        run: |
          [ -n "$APP_ORIGIN" ] || { echo "Set the APP_ORIGIN repository variable"; exit 1; }
          [ "$HAS_MIGRATION_URL" = "true" ] || { echo "Set the MIGRATION_DATABASE_URL secret"; exit 1; }
          [ "$HAS_SUPABASE_URL" = "true" ] || { echo "Set the VITE_SUPABASE_URL secret"; exit 1; }
          [ "$HAS_ANON_KEY" = "true" ] || { echo "Set the VITE_SUPABASE_ANON_KEY secret"; exit 1; }
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_URL: ${{ vars.APP_ORIGIN }}
          VITE_AUTH_REDIRECT_URL: ${{ vars.APP_ORIGIN }}/
          VITE_IOS_SHORTCUT_URL: ${{ vars.IOS_SHORTCUT_URL }}
      # The server is a Raspberry Pi, so images are built for arm64 under QEMU.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/cydoentis/linkables-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/cydoentis/linkables-web:${{ github.sha }}
      - name: Skip if a newer commit is on main
        id: head
        run: |
          git fetch --depth=1 origin main
          if [ "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "main has moved on; leaving :main to the newer run"
          fi
      - if: steps.head.outputs.current == 'true'
        run: pnpm db:migrate
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      - name: Point :main at this commit
        if: steps.head.outputs.current == 'true'
        run: |
          for app in api web; do
            docker buildx imagetools create \
              -t "ghcr.io/cydoentis/linkables-$app:main" \
              "ghcr.io/cydoentis/linkables-$app:$GITHUB_SHA"
          done
