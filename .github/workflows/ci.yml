name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm --filter web build
      - run: pnpm --filter extension build && pnpm --filter extension release:firefox
      - name: Preserve bundled dependency licenses
        run: |
          pnpm --dir apps/web licenses list --prod --json > /tmp/linkables-licenses.json
          node deploy/copy-notices.js /tmp/linkables-licenses.json apps/web/dist
          node deploy/copy-notices.js /tmp/linkables-licenses.json apps/extension/dist
          node deploy/copy-notices.js /tmp/linkables-licenses.json apps/extension/dist-firefox
      - run: pnpm --filter extension release && pnpm --filter extension release:firefox:source
      - uses: actions/upload-artifact@v7
        with:
          name: browser-extension-packages
          path: apps/extension/release/*.zip
          if-no-files-found: error

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm e2e
      - run: pnpm --filter web e2e:built
      - run: pnpm --filter extension e2e
        if: success() || failure()
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/e2e/playwright-report/
            apps/web/e2e/test-results/
            apps/extension/e2e/playwright-report/
            apps/extension/e2e/test-results/
          retention-days: 7

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f apps/api/Dockerfile -t linkables-api:ci .
      - run: bash deploy/smoke-test.sh linkables-api:ci
      - run: docker build -f apps/web/Dockerfile -t linkables-web:ci .

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [verify, e2e, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/cydoentis/linkables-api:${{ github.ref_name }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/cydoentis/linkables-web:${{ github.ref_name }}
