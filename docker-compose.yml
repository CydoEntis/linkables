name: linkables

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: linkables-api:local
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-file:/data/linkables.db}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET to a random value of at least 32 characters}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      WORKER_ENABLED: ${WORKER_ENABLED:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      OWNER_EMAIL: ${OWNER_EMAIL:-}
    volumes:
      - data:/data
      - ./backups:/backups
    logging:
      driver: local
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: linkables-web:local
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    logging:
      driver: local

volumes:
  data:
